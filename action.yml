name: "FileGit Compliance Enforcer"
description: "Verifies the cryptographic integrity of authorized context bundles."
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  repo-path:
    description: 'Path to the repository to verify'
    required: false
    default: '.'

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install FileGit CLI
      shell: bash
      run: |
        python -m pip install --upgrade pip
        # Install the CLI from the current repository path (in production, this would be a pip install filegit-cli)
        # Assuming the action is used in a repo where FileGit is already installed or it installs from source:
        pip install ${{ github.action_path }}

    - name: Verify Context Bundle
      id: verify
      shell: bash
      run: |
        echo "Running FileGit Verification..."
        filegit verify --repo-path ${{ inputs.repo-path }}
        
        # If the command exits with 0, we are good.
        echo "verification=success" >> $GITHUB_OUTPUT
        echo "evidence_path=${{ inputs.repo-path }}/.filegit/manifest.json" >> $GITHUB_OUTPUT

    - name: Upload Evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: filegit-evidence
        path: ${{ inputs.repo-path }}/.filegit/manifest.json
        retention-days: 90

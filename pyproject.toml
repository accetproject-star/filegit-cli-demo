[project]
name = "filegit-cli"
version = "0.1.0"
description = "Agentic governance and attestation CLI for FileGit."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.8.0",
    "pynacl>=1.5.0",
    "rich>=13.0.0",
    "mcp>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.30.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0"
]

[project.scripts]
filegit = "filegit.cli.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/filegit --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
